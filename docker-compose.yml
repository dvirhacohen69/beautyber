version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bod_user
      POSTGRES_PASSWORD: bod_password
      POSTGRES_DB: beauty_on_demand
    ports:
      - "5432:5432"
    volumes:
      - bod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bod_user -d beauty_on_demand"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bod_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Prisma Studio - ממשק צפייה ועריכה של מסד הנתונים (אופציונלי, לפיתוח בלבד)
  # הפעלה: docker compose --profile tools up prisma-studio
  # ---------------------------------------------------------------------
  # שים לב: ניתן גם להריץ "npm run prisma:studio" ישירות ללא Docker.

volumes:
  bod_postgres_data:
    name: bod_postgres_data
  bod_redis_data:
    name: bod_redis_data
